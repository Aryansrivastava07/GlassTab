name: Publish GlassTab updater

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
      - run: node scripts/prepare-update.mjs
        env:
          BUILD_ID: ${{ github.sha }}
      - run: python scripts/package-extension.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - id: deploy
        uses: actions/deploy-pages@v4
