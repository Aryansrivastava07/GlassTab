<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Sandbox</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: transparent;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
    }
    #widget-root {
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="widget-root"></div>

  <script>
    (function () {
      let currentWidgetId = null;
      let widgetSize = { width: 320, height: 180 };
      let localMemoryStore = {};
      const pendingRequests = new Map();
      let reqCounter = 0;

      const postToParent = (payload) => {
        window.parent.postMessage({ ...payload, widgetId: currentWidgetId }, '*');
      };

      const callParentRpc = (type, payload = {}, timeoutMs = 20000) => {
        const reqId = `req_${++reqCounter}_${Date.now()}`;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            pendingRequests.delete(reqId);
            reject(new Error(`${type} timed out`));
          }, timeoutMs);
          pendingRequests.set(reqId, { resolve, reject, timeout });
          postToParent({ type, reqId, ...payload });
        });
      };

      window.addEventListener('error', (event) => {
        postToParent({
          type: 'WIDGET_LOG',
          level: 'error',
          message: event.message || 'Script error',
        });
      });

      window.addEventListener('unhandledrejection', (event) => {
        postToParent({
          type: 'WIDGET_LOG',
          level: 'error',
          message: event.reason?.message || String(event.reason || 'Unhandled promise rejection'),
        });
      });

      // Public SDK exposed to user custom widgets
      window.WidgetAPI = {
        getSize: () => ({ ...widgetSize }),

        // CORS-free fetch routed through Extension Service Worker
        fetch: (url, options = {}) => {
          const reqId = `req_${++reqCounter}_${Date.now()}`;
          return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              pendingRequests.delete(reqId);
              reject(new Error('WidgetAPI.fetch timed out'));
            }, 25000);

            pendingRequests.set(reqId, { resolve, reject, timeout });
            postToParent({
              type: 'WIDGET_FETCH',
              reqId,
              url,
              options,
            });
          });
        },

        // Clean HTML string parser for lightweight web scraping
        parseHTML: (htmlString) => {
          return new DOMParser().parseFromString(htmlString || '', 'text/html');
        },

        // Lightweight XML/RSS parser
        parseXML: (xmlString) => {
          return new DOMParser().parseFromString(xmlString || '', 'text/xml');
        },

        // Per-widget persistent local DB
        storage: {
          get: (key, fallback = null) => {
            return Object.prototype.hasOwnProperty.call(localMemoryStore, key)
              ? localMemoryStore[key]
              : fallback;
          },
          set: (key, value) => {
            localMemoryStore[key] = value;
            postToParent({
              type: 'WIDGET_STORAGE_SET',
              key,
              value,
            });
          },
        },

        // Confirmed, fixed live data connectors (with validated query customization)
        sources: {
          scores: async (optionsOrForce = false) => {
            const opts =
              typeof optionsOrForce === 'object' && optionsOrForce !== null
                ? optionsOrForce
                : { force: Boolean(optionsOrForce) };
            const force = Boolean(opts.force);
            const filterText = String(opts.filter || opts.team || opts.query || '').trim();
            const limit = Math.min(20, Math.max(1, Number(opts.limit) || 20));

            const res = await window.WidgetAPI.fetch(
              'https://static.cricinfo.com/rss/livescores.xml',
              { cacheTtlMs: force ? 0 : 30000 }
            );
            const doc = window.WidgetAPI.parseXML(await res.text());
            let matches = Array.from(doc.querySelectorAll('item')).map((item) => ({
              title: item.querySelector('title')?.textContent?.trim() || 'Match',
              link: item.querySelector('link')?.textContent?.trim() || '',
            }));
            const totalCount = matches.length;
            if (filterText) {
              const needle = filterText.toLowerCase();
              matches = matches.filter((m) => m.title.toLowerCase().includes(needle));
            }
            matches = matches.slice(0, limit);

            return {
              matches,
              totalCount,
              filter: filterText,
              fromCache: Boolean(res.fromCache),
              updatedAt: new Date(res.fetchedAt || Date.now()).toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
              }),
            };
          },

          news: async (categoryOrOptions = 'tech', forceArg = false) => {
            const presets = ['india', 'world', 'sports', 'tech'];
            const opts =
              typeof categoryOrOptions === 'object' && categoryOrOptions !== null
                ? categoryOrOptions
                : (() => {
                    const raw = String(categoryOrOptions || 'tech').trim();
                    const low = raw.toLowerCase();
                    return presets.includes(low)
                      ? { category: low, force: Boolean(forceArg) }
                      : { query: raw, force: Boolean(forceArg) };
                  })();

            const force = Boolean(opts.force || forceArg);
            const ttl = force ? 0 : 60000;
            const rawCategory = String(opts.category || '').trim().toLowerCase();
            let query = String(opts.query || opts.q || '').trim();
            let cat = presets.includes(rawCategory) ? rawCategory : '';

            // If caller passed a preset inside query (e.g. query: 'india') with no category, treat cleanly
            if (query && presets.includes(query.toLowerCase()) && !cat) {
              cat = query.toLowerCase();
              query = '';
            }
            if (!query && !cat) {
              cat = 'tech';
            }

            const region = String(opts.region || (cat === 'world' ? 'US' : 'IN')).toUpperCase() === 'US' ? 'US' : 'IN';
            const when = ['1h', '1d', '7d', '1y'].includes(String(opts.when || '').trim())
              ? String(opts.when).trim()
              : '';
            const limit = Math.min(20, Math.max(1, Number(opts.limit) || 12));

            const parseFeedItems = (xmlText, sourceLabel) => {
              let doc = window.WidgetAPI.parseXML(xmlText);
              let items = Array.from(doc.querySelectorAll('item, entry'));
              if (items.length === 0) {
                doc = window.WidgetAPI.parseHTML(xmlText);
                items = Array.from(doc.querySelectorAll('item, entry'));
              }
              return items
                .slice(0, limit)
                .map((item) => {
                  const title = item.querySelector('title')?.textContent?.trim() || '';
                  const linkEl = item.querySelector('link');
                  const url =
                    linkEl?.getAttribute('href') ||
                    linkEl?.textContent?.trim() ||
                    '#';
                  const srcName =
                    item.querySelector('source')?.textContent?.trim() || sourceLabel;
                  const publishedAt =
                    item.querySelector('pubDate, published, updated')?.textContent?.trim() || '';
                  return { title, url, source: srcName, publishedAt };
                })
                .filter((a) => a.title);
            };

            const nowTime = () =>
              new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
              });

            // Hacker News Algolia path for 'tech' (supports both front_page and search query)
            if (cat === 'tech') {
              try {
                const hnUrl = query
                  ? `https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&hitsPerPage=${limit}`
                  : `https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=${limit}`;
                const res = await window.WidgetAPI.fetch(hnUrl, { cacheTtlMs: ttl });
                if (res.ok) {
                  const json = await res.json();
                  const articles = (json.hits || [])
                    .filter((h) => h.title)
                    .slice(0, limit)
                    .map((h) => ({
                      title: h.title,
                      url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
                      source: 'Hacker News',
                      publishedAt: h.created_at || '',
                    }));
                  if (articles.length > 0) {
                    return {
                      query: query || cat,
                      category: cat,
                      region,
                      when,
                      limit,
                      articles,
                      endpointUsed: hnUrl,
                      updatedAt: nowTime(),
                    };
                  }
                }
              } catch {
                // fall through to Google News RSS
              }
            }

            let urls = [];
            if (query) {
              const qWithWhen = when ? `${query} when:${when}` : query;
              const altReg = region === 'IN' ? 'US' : 'IN';
              // Strictly search for the requested query; never fall back to unrelated global headlines
              urls = [
                `https://news.google.com/rss/search?q=${encodeURIComponent(qWithWhen)}&hl=en-${region}&gl=${region}&ceid=${region}:en`,
                `https://news.google.com/rss/search?q=${encodeURIComponent(qWithWhen)}&hl=en-${altReg}&gl=${altReg}&ceid=${altReg}:en`,
              ];
            } else {
              const feedCandidates = {
                india: [
                  'https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en',
                  'https://feeds.feedburner.com/ndtvnews-india-news',
                ],
                world: [
                  'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en',
                  'https://feeds.bbci.co.uk/news/world/rss.xml',
                ],
                sports: [
                  `https://news.google.com/rss/headlines/section/topic/SPORTS?hl=en-${region}&gl=${region}&ceid=${region}:en`,
                  'https://www.espn.com/espn/rss/news',
                ],
                tech: [
                  `https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-${region}&gl=${region}&ceid=${region}:en`,
                ],
              };
              urls = feedCandidates[cat] || feedCandidates.world;
            }

            let lastErr = null;
            let lastEndpoint = urls[0] || '';
            for (const url of urls) {
              lastEndpoint = url;
              try {
                const res = await window.WidgetAPI.fetch(url, { cacheTtlMs: ttl });
                if (!res.ok) {
                  lastErr = new Error(`HTTP ${res.status}`);
                  continue;
                }
                const xmlText = await res.text();
                const articles = parseFeedItems(xmlText, query || cat.toUpperCase());
                if (articles.length > 0) {
                  return {
                    query: query || cat,
                    category: cat || 'search',
                    region,
                    when,
                    limit,
                    articles,
                    endpointUsed: url,
                    updatedAt: nowTime(),
                  };
                }
              } catch (err) {
                lastErr = err;
              }
            }

            if (query && !lastErr) {
              return {
                query,
                category: cat || 'search',
                region,
                when,
                limit,
                articles: [],
                emptyReason: `No news articles matched "${query}".`,
                endpointUsed: lastEndpoint,
                updatedAt: nowTime(),
              };
            }

            throw lastErr || new Error('Unable to fetch news feed');
          },

          calendar: (monthOffsetOrOptions = 0) => {
            const opts =
              typeof monthOffsetOrOptions === 'object' && monthOffsetOrOptions !== null
                ? monthOffsetOrOptions
                : { monthOffset: Number(monthOffsetOrOptions) || 0 };
            const monthOffset = Number(opts.monthOffset) || 0;
            const weekStartsOn = Number(opts.weekStartsOn) === 1 ? 1 : 0;

            const now = new Date();
            const target = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
            const year = target.getFullYear();
            const month = target.getMonth();
            const firstDayOfWeek = target.getDay();
            const leadingEmpty = (firstDayOfWeek - weekStartsOn + 7) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const days = [];
            for (let i = 0; i < leadingEmpty; i++) days.push(null);
            for (let d = 1; d <= daysInMonth; d++) {
              const isToday =
                d === now.getDate() && month === now.getMonth() && year === now.getFullYear();
              days.push({ day: d, isToday });
            }
            return {
              year,
              month,
              weekStartsOn,
              monthName: target.toLocaleString('default', { month: 'long' }),
              todayLabel: now.toLocaleDateString(undefined, {
                weekday: 'long',
                month: 'short',
                day: 'numeric',
              }),
              days,
            };
          },

          battery: () => callParentRpc('WIDGET_BATTERY_GET', {}, 5000),

          internetSpeed: (optionsOrActiveTest = true) => {
            const opts =
              typeof optionsOrActiveTest === 'object' && optionsOrActiveTest !== null
                ? optionsOrActiveTest
                : { activeTest: optionsOrActiveTest !== false };
            return callParentRpc(
              'WIDGET_SPEED_TEST',
              {
                activeTest: opts.activeTest !== false,
                bytes: Math.min(2000000, Math.max(100000, Number(opts.bytes) || 500000)),
              },
              15000
            );
          },

          mirror: {
            start: (options = {}) => callParentRpc('WIDGET_MIRROR_CMD', { action: 'start', options }, 10000),
            stop: () => callParentRpc('WIDGET_MIRROR_CMD', { action: 'stop' }, 5000),
            setOptions: (options = {}) =>
              callParentRpc('WIDGET_MIRROR_CMD', { action: 'options', options }, 3000),
          },
        },
      };

      const mountWidgetCode = (rawCode) => {
        const root = document.getElementById('widget-root');
        root.innerHTML = '';

        // Parse full HTML or fragment cleanly and execute <script> tags
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawCode || '', 'text/html');

        // Clean previously injected dynamic styles/scripts
        document.querySelectorAll('[data-widget-dynamic="true"]').forEach((el) => el.remove());

        // Copy <style> tags from head & body
        const styles = doc.querySelectorAll('style');
        styles.forEach((styleEl) => {
          const cloned = document.createElement('style');
          cloned.setAttribute('data-widget-dynamic', 'true');
          cloned.textContent = styleEl.textContent;
          document.head.appendChild(cloned);
        });

        // Copy body HTML excluding script tags first
        const scripts = Array.from(doc.querySelectorAll('script'));
        scripts.forEach((s) => s.parentNode?.removeChild(s));

        root.innerHTML = doc.body.innerHTML;

        // Re-create and execute scripts inside an isolated async-friendly scope
        scripts.forEach((scriptEl) => {
          const codeText = scriptEl.textContent || '';
          if (!codeText.trim()) return;
          const executable = document.createElement('script');
          executable.setAttribute('data-widget-dynamic', 'true');
          executable.textContent = `(function(){\ntry {\n${codeText}\n} catch(err) {\n  window.parent.postMessage({ type: 'WIDGET_LOG', level: 'error', widgetId: ${JSON.stringify(currentWidgetId)}, message: err.message || String(err) }, '*');\n}\n})();`;
          document.body.appendChild(executable);
        });
      };

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'INIT_WIDGET') {
          currentWidgetId = data.widgetId;
          widgetSize = { width: data.width || 320, height: data.height || 180 };
          localMemoryStore = data.initialStorage || {};
          mountWidgetCode(data.code || '');
        } else if (data.type === 'WIDGET_RESIZE') {
          widgetSize = { width: data.width || 320, height: data.height || 180 };
          window.dispatchEvent(new CustomEvent('widget-resize', { detail: widgetSize }));
        } else if (data.type === 'WIDGET_RPC_RESULT') {
          const pending = pendingRequests.get(data.reqId);
          if (!pending) return;
          clearTimeout(pending.timeout);
          pendingRequests.delete(data.reqId);
          if (data.error) {
            pending.reject(new Error(data.error));
          } else {
            pending.resolve(data.result);
          }
        } else if (data.type === 'WIDGET_FETCH_RESULT') {
          const pending = pendingRequests.get(data.reqId);
          if (!pending) return;
          clearTimeout(pending.timeout);
          pendingRequests.delete(data.reqId);

          if (!data.ok && data.error) {
            pending.reject(new Error(data.error));
          } else {
            pending.resolve({
              ok: Boolean(data.ok),
              status: data.status || 200,
              text: () => Promise.resolve(data.text || ''),
              rawText: data.text || '',
              json: () => Promise.resolve(JSON.parse(data.text || '{}')),
              fromCache: Boolean(data.fromCache),
              fetchedAt: data.fetchedAt,
            });
          }
        }
      });

      // Notify parent that sandbox iframe is ready
      window.parent.postMessage({ type: 'SANDBOX_READY' }, '*');
    })();
  </script>
</body>
</html>
